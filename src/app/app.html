<header class="site-header">
  <div class="container">
    <h1 class="brand">
      <svg class="brand-mark" viewBox="-12 -12 24 24" aria-hidden="true">
        <ellipse class="brand-orbit" rx="10.5" ry="5" transform="rotate(-25)" />
        <circle class="brand-body" r="4.5" />
        <circle class="brand-craft" cx="9.5" cy="-4.4" r="1.6" />
      </svg>
      KSP Transfer Window
    </h1>
    <nav aria-label="Main">
      <a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="startPage">Transfer windows</a>
      <a routerLink="/satellites" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="page">Satellites</a>
    </nav>
    <button type="button" class="button lamp" data-testid="theme-toggle" [attr.aria-pressed]="theme.current() === 'dark'" (click)="theme.toggle()">
      Dark mode
    </button>
  </div>
</header>

<main class="container">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container">
    <p>
      Based on the <a href="https://github.com/alexmoon/ksp">KSP Launch Window Planner</a> by Alex Moon. Licensed under
      <a href="http://creativecommons.org/licenses/by-nc-sa/4.0/" rel="license">CC BY-NC-SA 4.0</a>.
      Stock KSP 1 solar system.
    </p>
  </div>
</footer>
