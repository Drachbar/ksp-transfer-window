<ol class="windows">
  @for (row of rows(); track $index) {
    <li>
      <button type="button" class="window" [attr.aria-pressed]="selected() === $index" [attr.aria-label]="row.label"
              (click)="selected.set($index)">
        <span class="departure">{{ row.departure }}</span>
        <span class="dv">{{ row.deltaV }}</span>
        <span class="meta">{{ row.wait }} · {{ row.flightTime }} flight</span>
        @if (row.cheapest) {
          <span class="badge">Cheapest</span>
        }
      </button>
    </li>
  }
</ol>
