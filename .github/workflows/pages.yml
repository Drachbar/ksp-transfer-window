# Builds the app and publishes it to GitHub Pages.
#
# Runs on GitHub only: Gitea Actions uses .gitea/workflows/ and ignores this directory.
# To use it in a fork: Settings → Pages → Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - run: npm ci

      - run: npm test -- --watch=false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # The site lives under /<repository>/ (or / with a custom domain).
      - name: Build
        run: npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"

      # GitHub Pages has no SPA fallback: serve the app for unknown paths too.
      - name: Add 404 fallback
        run: cp dist/ksp-transfer-window/browser/index.html dist/ksp-transfer-window/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/ksp-transfer-window/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
